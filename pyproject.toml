[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logistat"
version = "0.1.0"
description = "LogiStat – Analyse statistique et prédiction des retards de livraison (INF-5103, UQO)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Équipe LogiStat" }]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests longs (lancement de l'interface)",
    "donnees_completes: tests qui demandent le jeu complet data/prepare/ (exclus de la CI)",
]

[tool.coverage.run]
source = ["src/logistat"]
omit = ["src/logistat/ui/*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "PD", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]  # imports après l'ajout de src/ au chemin
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
